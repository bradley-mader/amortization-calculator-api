apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - ../../base
images:
  - name: amortization-api
    newTag: local
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: amortization-api
      spec:
        template:
          spec:
            containers:
              - name: server
                imagePullPolicy: Never
    target:
      kind: Deployment
      name: amortization-api

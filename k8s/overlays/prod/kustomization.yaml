apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
  - ../../base/cluster-issuer-prod
images:
  - name: amortization-api
    newName: ghcr.io/bradley-mader/ammortizationcalculatorapi
    newTag: prod-latest
patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: amortization-api
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: server
                resources:
                  requests:
                    cpu: 250m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 256Mi
    target:
      kind: Deployment
      name: amortization-api

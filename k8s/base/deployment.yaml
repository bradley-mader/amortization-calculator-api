apiVersion: apps/v1
kind: Deployment
metadata:
  name: amortization-api
  labels:
    app: amortization-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amortization-api
  template:
    metadata:
      labels:
        app: amortization-api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: server
          image: amortization-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
